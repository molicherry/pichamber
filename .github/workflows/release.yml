name: Release qualification baseline (no publication)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate the manifest-selected CI baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run CI profile from the release manifest
        run: bun run release:scenarios -- --profile ci
      - name: Publication policy
        run: |
          echo "This workflow never publishes and never uploads local qualification evidence."
          echo "Release publication is local-only via: bun run release:qualify && bun run release:publish"
