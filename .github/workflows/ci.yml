name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  web:
    name: Type-check / test / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build UI (vite)
        run: bun run --filter @pichamber/ui build

  docker:
    name: Build and push GHCR image
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: imgtags
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "value<<EOF"
              echo "ghcr.io/${{ github.repository }}:latest"
              echo "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.imgtags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Future surfaces (enabled when implemented) ---
  # desktop: type-check + electron build  (packages/electron, phase 2)
  # mobile:  type-check + mobile build    (packages/mobile, TBD)
